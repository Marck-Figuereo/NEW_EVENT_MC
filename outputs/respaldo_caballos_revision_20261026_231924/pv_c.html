<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <title>Racing Virtual Horses</title>

    <link href="static/bootstrap.min.css?v={{version1}}" rel="stylesheet">

    <link rel="stylesheet" href="static/css/all.min.css?v={{version1}}">
    <link rel="stylesheet" type="text/css" href="static/css/style_c.css?v={{vjs}}">
    <link rel="stylesheet" type="text/css" href="static/css/overlay_video.css?v={{vjs}}">

  <body>    
    
    
    <video id="intro" playsinline></video>
    <video id="evento" playsinline></video>

    <!-- PANTALLA DE TABLAS (diseno 1920x1080 que se escala a la pantalla; ver style_c.css "TABLERO").
         Los id son los mismos de siempre: cone_db_p.js y funcionamiento_p.js los llenan igual. -->
    <main id="cuerpo" class="vh">
      <div class="vh-escenario">

        <div class="vh-portada"></div>

        <!-- Logo y lugar -->
        <div class="vh-marca">
          <img class="vh-logo" src='static/img/tablero/logo.png' alt="">
          <div class="vh-lugar"><i class="fa-solid fa-location-dot vh-icono"></i><label class="txt_lgr"></label></div>
        </div>

        <!-- Carrera, tiempo y jackpots -->
        <div class="vh-estado">
          <div class="vh-caja vh-carrera"><span class="vh-etq">CARRERA</span><label id="id_sorteos_c_id"></label></div>
          <div class="vh-caja vh-tiempo"><label id="tiempo_regresivo"></label><span class="vh-etq">TIEMPO RESTANTE</span></div>
          <div class="vh-jack vh-jack-global"><span class="vh-jack-etq">JACKPOT <b>GLOBAL</b></span><label id="jp_global"></label></div>
          <div class="vh-jack vh-jack-local"><span class="vh-jack-etq">JACKPOT <b>LOCAL</b></span><label id="jp_local"></label></div>
        </div>

        <!-- Historial de carreras -->
        <section class="vh-panel vh-historial">
          <div class="vh-panel-titulo"><i class="fa-solid fa-clock-rotate-left vh-icono"></i>HISTORIAL DE CARRERAS</div>
          <div class="vh-hist-item">
            <div class="vh-hist-num"><label id="numero_race0"></label><img id="bns0" alt=""></div>
            <div class="vh-hist-fila"><img id="lugarimg_1er0" alt=""><i></i><label id="lugarprc_1er0"></label></div>
            <div class="vh-hist-fila"><img id="lugarimg_pls_1er0" alt=""><img id="lugarimg_pls_2do0" alt=""><label id="lugarprc_pls0"></label></div>
          </div>
          <div class="vh-hist-item">
            <div class="vh-hist-num"><label id="numero_race1"></label><img id="bns1" alt=""></div>
            <div class="vh-hist-fila"><img id="lugarimg_1er1" alt=""><i></i><label id="lugarprc_1er1"></label></div>
            <div class="vh-hist-fila"><img id="lugarimg_pls_1er1" alt=""><img id="lugarimg_pls_2do1" alt=""><label id="lugarprc_pls1"></label></div>
          </div>
          <div class="vh-hist-item">
            <div class="vh-hist-num"><label id="numero_race2"></label><img id="bns2" alt=""></div>
            <div class="vh-hist-fila"><img id="lugarimg_1er2" alt=""><i></i><label id="lugarprc_1er2"></label></div>
            <div class="vh-hist-fila"><img id="lugarimg_pls_1er2" alt=""><img id="lugarimg_pls_2do2" alt=""><label id="lugarprc_pls2"></label></div>
          </div>
          <div class="vh-hist-item">
            <div class="vh-hist-num"><label id="numero_race3"></label><img id="bns3" alt=""></div>
            <div class="vh-hist-fila"><img id="lugarimg_1er3" alt=""><i></i><label id="lugarprc_1er3"></label></div>
            <div class="vh-hist-fila"><img id="lugarimg_pls_1er3" alt=""><img id="lugarimg_pls_2do3" alt=""><label id="lugarprc_pls3"></label></div>
          </div>
          <div class="vh-hist-item">
            <div class="vh-hist-num"><label id="numero_race4"></label><img id="bns4" alt=""></div>
            <div class="vh-hist-fila"><img id="lugarimg_1er4" alt=""><i></i><label id="lugarprc_1er4"></label></div>
            <div class="vh-hist-fila"><img id="lugarimg_pls_1er4" alt=""><img id="lugarimg_pls_2do4" alt=""><label id="lugarprc_pls4"></label></div>
          </div>
        </section>

        <!-- Cuotas: fila = primero, columna = segundo; la diagonal es el ganador (WIN) -->
        <section class="vh-panel vh-tabla">
          <div class="vh-esquina"></div>
          <div class="vh-col nr"><img src="static/img/tablero/n1.png" alt="1"></div>
          <div class="vh-col nw"><img src="static/img/tablero/n2.png" alt="2"></div>
          <div class="vh-col nb"><img src="static/img/tablero/n3.png" alt="3"></div>
          <div class="vh-col ny"><img src="static/img/tablero/n4.png" alt="4"></div>
          <div class="vh-col ng"><img src="static/img/tablero/n5.png" alt="5"></div>
          <div class="vh-col nk"><img src="static/img/tablero/n6.png" alt="6"></div>
          <div class="vh-col no"><img src="static/img/tablero/n7.png" alt="7"></div>
          <div class="vh-fil nr"><img src="static/img/tablero/n1.png" alt="1"></div>
          <div class="precios_tbl vh-cel" id="1-1"></div>
          <div class="precios_tbl vh-cel" id="1-2"></div>
          <div class="precios_tbl vh-cel" id="1-3"></div>
          <div class="precios_tbl vh-cel" id="1-4"></div>
          <div class="precios_tbl vh-cel" id="1-5"></div>
          <div class="precios_tbl vh-cel" id="1-6"></div>
          <div class="precios_tbl vh-cel" id="1-7"></div>
          <div class="vh-fil nw"><img src="static/img/tablero/n2.png" alt="2"></div>
          <div class="precios_tbl vh-cel" id="2-1"></div>
          <div class="precios_tbl vh-cel" id="2-2"></div>
          <div class="precios_tbl vh-cel" id="2-3"></div>
          <div class="precios_tbl vh-cel" id="2-4"></div>
          <div class="precios_tbl vh-cel" id="2-5"></div>
          <div class="precios_tbl vh-cel" id="2-6"></div>
          <div class="precios_tbl vh-cel" id="2-7"></div>
          <div class="vh-fil nb"><img src="static/img/tablero/n3.png" alt="3"></div>
          <div class="precios_tbl vh-cel" id="3-1"></div>
          <div class="precios_tbl vh-cel" id="3-2"></div>
          <div class="precios_tbl vh-cel" id="3-3"></div>
          <div class="precios_tbl vh-cel" id="3-4"></div>
          <div class="precios_tbl vh-cel" id="3-5"></div>
          <div class="precios_tbl vh-cel" id="3-6"></div>
          <div class="precios_tbl vh-cel" id="3-7"></div>
          <div class="vh-fil ny"><img src="static/img/tablero/n4.png" alt="4"></div>
          <div class="precios_tbl vh-cel" id="4-1"></div>
          <div class="precios_tbl vh-cel" id="4-2"></div>
          <div class="precios_tbl vh-cel" id="4-3"></div>
          <div class="precios_tbl vh-cel" id="4-4"></div>
          <div class="precios_tbl vh-cel" id="4-5"></div>
          <div class="precios_tbl vh-cel" id="4-6"></div>
          <div class="precios_tbl vh-cel" id="4-7"></div>
          <div class="vh-fil ng"><img src="static/img/tablero/n5.png" alt="5"></div>
          <div class="precios_tbl vh-cel" id="5-1"></div>
          <div class="precios_tbl vh-cel" id="5-2"></div>
          <div class="precios_tbl vh-cel" id="5-3"></div>
          <div class="precios_tbl vh-cel" id="5-4"></div>
          <div class="precios_tbl vh-cel" id="5-5"></div>
          <div class="precios_tbl vh-cel" id="5-6"></div>
          <div class="precios_tbl vh-cel" id="5-7"></div>
          <div class="vh-fil nk"><img src="static/img/tablero/n6.png" alt="6"></div>
          <div class="precios_tbl vh-cel" id="6-1"></div>
          <div class="precios_tbl vh-cel" id="6-2"></div>
          <div class="precios_tbl vh-cel" id="6-3"></div>
          <div class="precios_tbl vh-cel" id="6-4"></div>
          <div class="precios_tbl vh-cel" id="6-5"></div>
          <div class="precios_tbl vh-cel" id="6-6"></div>
          <div class="precios_tbl vh-cel" id="6-7"></div>
          <div class="vh-fil no"><img src="static/img/tablero/n7.png" alt="7"></div>
          <div class="precios_tbl vh-cel" id="7-1"></div>
          <div class="precios_tbl vh-cel" id="7-2"></div>
          <div class="precios_tbl vh-cel" id="7-3"></div>
          <div class="precios_tbl vh-cel" id="7-4"></div>
          <div class="precios_tbl vh-cel" id="7-5"></div>
          <div class="precios_tbl vh-cel" id="7-6"></div>
          <div class="precios_tbl vh-cel" id="7-7"></div>
        </section>

        <!-- Ultimo jackpot -->
        <footer class="vh-panel vh-pie">
          <div class="vh-dato vh-dato-titulo"><i class="fa-solid fa-trophy vh-icono"></i><div><span class="vh-etq">ULTIMO JACKPOT</span><label id="monto_info"></label></div></div>
          <div class="vh-dato"><i class="fa-solid fa-ticket vh-icono"></i><div><span class="vh-etq">TICKET</span><label id="id_tk_info"></label></div></div>
          <div class="vh-dato"><i class="fa-solid fa-store vh-icono"></i><div><span class="vh-etq">LUGAR</span><label id="lugar_info"></label></div></div>
          <div class="vh-dato"><i class="fa-solid fa-calendar-days vh-icono"></i><div><span class="vh-etq">FECHA</span><label id="date_info"></label></div></div>
        </footer>

        <div class="vh-version">{{version1}}</div>
      </div>

      <!-- El diseno mide 1920x1080: se escala para llenar la pantalla sin deformarse -->
      <script>
        (function () {
          var escenario = document.querySelector('#cuerpo .vh-escenario')
          var ajustar = function () { escenario.style.setProperty('--k', Math.min(window.innerWidth / 1920, window.innerHeight / 1080)) }
          ajustar()
          window.addEventListener('resize', ajustar)
        })()
      </script>
    </main>
    




    

    <div id="ganador-bono" class="ganador-bono">

      <div id="titulow" ><label id="tiu_label">GANADOR DEL BONO</label></div>

      <input type="text" id="id_bns" readonly>
      <input type="text" id="mnt_bns" readonly>
      
      
            
    </div>
  



     <div class="container-fluid themed-container container4" id="container-jackpots">

      <div class="row">
        <div class="col-md-12 themed-grid-col d-flex justify-content-center">
          <div class="banner-jp">
            <a href="#"><p>GANADOR JACKPOT</p></a>
          </div>
        </div>

      </div>
      
      

    </div>


    



   

    <div class="container-fluid themed-container container2" id="container-resultado-carrera">
          
      <div class="row">

      


        <div class="col-md-12 themed-grid-col" >
          
          
          <div class="row">

           
            <div class="col-md-5 themed-grid-col d-flex justify-content-end">
              <table class="table-info-result numero-carrera">
                <tbody>
                  <tr>
                    <td style="border-radius: 20px !important;">
                      <p><span>CARRERA NO.</span> <i id="n_race"> </i></p>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div class="col-md-7 themed-grid-col d-flex justify-content-between">
              <table class="table-info-result">
                <tbody>
                  <tr>
                    <td style="border-radius: 20px !important;" width="70%" style="padding:35px;">
                      <img id="img_win" width="55%">
                    </td>
                    <td style="border-radius: 20px !important;"  style="font-size:100px;" width="50%" id="p_win"></td>
                    
                  </tr>
                </tbody>
              </table>
            </div>

          </div>
          
          <div class="row fila_2">
            

            
            <div class="col-md-12 themed-grid-col d-flex justify-content-center">



              <table class="table-info-result">
                
                <tbody>
                  <tr>
                    <td style="padding:80px 30px; border-radius: 20px !important;" class="d-flex justify-content-evenly">
                        <img width="35%" id="img1_ext">
                        <img width="35%" id="img2_ext">
                    </td>
                    <td style="border-radius: 20px !important;" id="p_ext"></td>
                  </tr>
                </tbody>
              </table>
                
            
            
            </div>
              

            
        
          </div>
          
        </div>

        
      </div>





    </div>
    





<div class="container themed-container" id="container-resultado-bonos">

  <div class="row">
    <div class="col-md-12 themed-grid-col d-flex justify-content-center">
      <img id="pos_bono" style="width: 150px;"> 
    </div>

  </div>
  
  

</div>

      


    <input id="gmt2" type="hidden" value="{{gmt1}}">
    <input id="formato_hora2"    type="hidden" value="{{formato_hora1}}">

    <input id="id_cons2"          type="hidden" value="{{id_cons1}}">

    
    <!-- Datos sobre el video del evento: la pantalla de resultados viene incrustada en el video -->
    <!-- ov_caballos: los videos de caballos traen el cuadro de RESULTADOS y el de CARRERA
         en otra posicion que los de perros (ver overlay_video.css) -->
    <div id="overlay-video" class="ov_caballos">
      <div id="ov_carrera"><span class="ov_etiqueta">CARRERA</span><span id="ov_numero"></span></div>
      <div id="ov_replay">REPLAY</div>
      <div id="ov_titulo" class="ov_resultado">RESULTADOS</div>
      <div id="ov_win"    class="ov_resultado"></div>
      <div id="ov_exacta" class="ov_resultado"></div>
    </div>

  </body>
  
  <script src="static/js/moment.min.js"></script>

  <script src="static/js/sweetalert2@11.js"></script>

  <script src="../static/js/jquery.loadingModal.js?v={{version1}}"></script>

  <script src="static/js/bootstrap.bundle.min.js?v={{version1}}"></script>

  <script src="static/js/funcionamiento_p.js?v={{vjs}}"></script>
