<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070d22">
<title>Números de la suerte · DEMP LottoView</title>
<!-- Lo que abre el QR del visor. Usa los mismos estáticos del visor de TV (static/loteria/). -->
<base href="/static/loteria/">
<link rel="stylesheet" href="css/movil.css?v={{vjs}}">
</head>
<body>

<div class="app">

  <header class="barra">
    <img class="barra-logo" src="img/marca/demp.svg" alt="DEMP">
    <span class="barra-nombre">LOTTOVIEW</span>
  </header>

  <!-- ============ 1. FORMULARIO ============ -->
  <main class="vista" id="vistaForm">
    <h1 class="titulo">Números de la suerte</h1>
    <p class="intro">Elige tu lotería, escribe tu nombre y te damos tu jugada.</p>

    <form id="form" novalidate autocomplete="off">
      <fieldset class="bloque">
        <legend class="etiqueta">Lotería</legend>
        <div class="loterias" id="loterias" role="radiogroup"></div>
        <p class="proximo" id="proximo" aria-live="polite"></p>
      </fieldset>

      <div class="bloque">
        <label class="etiqueta" for="nombre">Tu nombre</label>
        <input class="campo" id="nombre" name="nombre" type="text" maxlength="18"
               placeholder="Escribe tu nombre" enterkeyhint="go" autocapitalize="words" spellcheck="false">
        <p class="error" id="error" role="alert"></p>
      </div>

      <div class="accion">
        <button class="boton" id="generar" type="button">Generar mi jugada</button>
      </div>
    </form>
  </main>

  <!-- ============ 2. RESULTADO ============ -->
  <main class="vista" id="vistaResultado" hidden>
    <p class="res-para" id="resPara"></p>
    <h1 class="titulo res-titulo" id="resTitulo"></h1>

    <div class="tarjeta-jugada">
      <div class="res-cab" id="resCab"></div>
      <div class="tombola" id="tombola"><canvas id="bombo" aria-hidden="true"></canvas></div>
      <div class="bolas" id="bolas"></div>
      <p class="res-estado" id="resEstado" aria-live="polite"></p>
      <p class="res-fecha" id="resFecha"></p>
      <button class="saltar" id="saltar" type="button">Toca para ver ya</button>
    </div>

    <div class="acciones" id="acciones">
      <a class="boton boton-wa" id="compartir" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.1.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .2-1.2c-.1-.1-.3-.2-.5-.3z"/></svg>
        Compartir por WhatsApp
      </a>
      <button class="boton boton-sec" id="otra" type="button">Generar otra jugada</button>
      <button class="enlace" id="cambiar" type="button">Cambiar lotería o nombre</button>
    </div>
  </main>

  <canvas class="confeti" id="confeti" aria-hidden="true"></canvas>
  <footer class="pie">Números al azar, solo para divertirte. Juega con responsabilidad.</footer>
</div>

<script>window.VISOR_CONFIG = { static: './' };</script>
<script src="js/catalogo_loterias.js?v={{vjs}}"></script>
<script src="js/movil.js?v={{vjs}}"></script>
</body>
</html>
