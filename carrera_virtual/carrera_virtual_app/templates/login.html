<!DOCTYPE html> 
<html lang="en">
  <head>
  	<title>Racing Virtual Dogs</title>

  	<!--<link  rel="shortcut icon"   href="../static/images/icon/favicon.ico" type="image/ico" />-->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

	<link href="https://fonts.googleapis.com/css?family=Lato:300,400,700&display=swap" rel="stylesheet">


	

	
	<link rel="stylesheet" href="../static/css/css_login/style.css">

	</head>
	<body class="img js-fullheight" style="background-image: url(../static/img/img.jpg);">
		<section class="ftco-section">
			<div class="container">
				<div class="row justify-content-center">
					<div class="col-md-6 text-center mb-5">
						
					</div>
				</div>
				<div class="row justify-content-center">
					<div class="col-md-6 col-lg-4">
							<div class="login-wrap p-0">
						<h3 class="mb-4 text-center">LOGIN</h3>
						<form class="signin-form">
							{% csrf_token %}
							<div class="form-group">
								<input id="user" type="text" class="form-control" name="username" placeholder="Usuario" required>
							</div>
							<div class="form-group">
								<input id="password-field" type="password" class="form-control" name="password" placeholder="Clave" required>
								<span toggle="#password-field" class="fa fa-fw fa-eye field-icon toggle-password"></span>
							</div>
							<div class="form-group">
								<button id='buscar_log'  class="form-control btn btn-primary submit px-3">Iniciar</button>
							</div>
					
						</form>
					
						<p class="w-100 text-center">&mdash; Racing Virtual Dogs &mdash;</p>
				
					</div>
				</div>
			</div>
		</div>
	</section>


	<script src="static/js/sweetalert2@11.js"></script>

	<script src="../static/js/js_login/jquery.min.js"></script>
	
	<script src="../static/js/js_login/popper.js"></script>
	<script src="../static/js/js_login/bootstrap.min.js"></script>
	<script src="../static/js/js_login/main.js"></script>

	</body>
</html>
