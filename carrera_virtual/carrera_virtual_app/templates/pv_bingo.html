<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bingo — Visor</title>
<!-- Todas las rutas relativas del bingo (iframe, assets, JSON de prueba) viven en static/bingo/ -->
<base href="/static/bingo/">
<link rel="stylesheet" href="bingo_integration.css?v={{vjs}}">
</head>
<body>

<!-- =======================================================================
     ESCENARIO ÚNICO 1920 x 1080 (mismo esquema que pv_ruleta.html)

       #view-bingo  -> screens/show-bingo/index.html  (canvas del bingo)
                       tiene dos páginas internas:
                         SORTEOS  (pasados, próximos, especiales, jackpot, conteo)
                         SORTEO   (bombo, 60 bolas, ganadores, jackpot)

     El ciclo (cuándo se juega cada sorteo) lo lleva funcionamiento_bingo.js.
     Los datos los da cone_db_bingo.js: la API por /games, o con ?test=1
     data/sorteos_prueba_bingo.json y un socket simulado.
     ======================================================================= -->

<div id="stage">

    <iframe id="view-bingo"
            class="view"
            src="screens/show-bingo/index.html?v={{vjs}}"
            scrolling="no"
            title="Bingo"></iframe>

    <!-- Aviso que no depende del canvas (datos no disponibles, etc.) -->
    <div id="bingo-alerta" hidden>
        <strong id="bingo-alerta-titulo"></strong>
        <span id="bingo-alerta-texto"></span>
    </div>

</div>

<!-- Solo aparece si el navegador bloquea el audio hasta un clic -->
<button id="tap-hint" hidden>Iniciar visor</button>

<!-- Solo con ?debug=1 -->
<div id="flow-hud" hidden></div>

<script>window.VISOR_CONFIG = { wsUrl: "{{ ws_url|escapejs }}" };</script>

<!-- Control del visor en tiempo real (estado, suspension, revocacion), comun a todos los juegos -->
<script src="/static/js/control_visor.js?v={{vjs}}"></script>

<script src="cone_db_bingo.js?v={{vjs}}"></script>
<script src="funcionamiento_bingo.js?v={{vjs}}"></script>

</body>
</html>
