<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DEMP LottoView — Visor de loterías</title>
<!-- Todas las rutas relativas de la lotería (css, js, imágenes, fuentes) viven en static/loteria/ -->
<base href="/static/loteria/">
<link rel="stylesheet" href="css/visor_tv.css?v={{vjs}}">
</head>
<!-- =======================================================================
     DEMP LOTTOVIEW · ESCENARIO 1920 x 1080 (se escala solo a la TV)

       Escenas que rotan:  QUINIELAS (3 páginas) -> MODALIDADES -> HORARIOS
       Capas:              ¡NUEVO(S) RESULTADO(S)! y NÚMEROS DE LA SUERTE (QR)

     Por ahora los datos son de PRUEBA (simulados en cone_db_loterias.js).
     Catálogo de loterías, horarios y logos: js/catalogo_loterias.js
     Marca, QR y tiempos: js/config_visor.js
     Ver herramientas/LOTERIA_LEEME.md
     ======================================================================= -->
<body>
  <!-- Escenario fijo 1920x1080: se escala solo al tamaño de la TV -->
  <div id="escenario" class="escenario">

    <div class="fondo" aria-hidden="true">
      <div class="fondo-capa" id="fondoA"></div>
      <div class="fondo-capa" id="fondoB"></div>
      <div class="fondo-velo"></div>
    </div>

    <!-- ============ CABECERA ============ -->
    <header class="cabecera">
      <div class="marca">
        <div class="marca-logo" id="marcaLogo"></div>
        <div class="marca-texto">
          <div class="marca-nombre" id="marcaNombre"></div>
          <div class="marca-sub" id="marcaSub"></div>
        </div>
      </div>

      <div class="qr-bloque">
        <div class="qr-codigo" id="qrCodigo"></div>
        <svg class="qr-tel" viewBox="0 0 24 40" aria-hidden="true">
          <rect x="1.5" y="1.5" width="21" height="37" rx="4" fill="none" stroke="currentColor" stroke-width="2"/>
          <rect x="8" y="5" width="8" height="2" rx="1" fill="currentColor"/>
          <rect x="6" y="13" width="12" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <rect x="9" y="16" width="6" height="6" fill="currentColor"/>
          <circle cx="12" cy="33" r="1.8" fill="currentColor"/>
        </svg>
        <div class="qr-texto" id="qrTexto"><span>ESCANEA</span><span>PARA JUGAR</span></div>
      </div>

      <div class="reloj-bloque">
        <div class="reloj">
          <div class="reloj-fecha" id="relojFecha">—</div>
          <div class="reloj-hora"><span id="relojHora">--:--</span><small id="relojAmpm"></small></div>
        </div>
        <div class="lema" id="lema"></div>
      </div>

      <svg class="cabecera-curva" viewBox="0 0 1920 40" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="gOro" x1="0" x2="1">
            <stop offset="0" stop-color="#f7d774" stop-opacity="0"/>
            <stop offset=".18" stop-color="#f7d774" stop-opacity=".9"/>
            <stop offset=".55" stop-color="#c9932d" stop-opacity=".7"/>
            <stop offset=".82" stop-color="#f7d774" stop-opacity=".95"/>
            <stop offset="1" stop-color="#f7d774" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <path d="M0 6 C 420 34, 980 36, 1340 26 S 1760 6, 1920 2" fill="none" stroke="url(#gOro)" stroke-width="2.2"/>
      </svg>
    </header>

    <!-- ============ TÍTULO DE ESCENA ============ -->
    <div class="titulo-escena">
      <div class="titulo-izq">
        <div class="titulo-kicker" id="tituloKicker">RESULTADOS DE HOY</div>
        <div class="titulo-principal" id="tituloPrincipal">Loterías dominicanas</div>
      </div>
      <div class="titulo-der">
        <div class="titulo-dia" id="tituloDia"></div>
        <div class="paginador" id="paginador"></div>
      </div>
    </div>

    <!-- ============ ESCENAS ============ -->
    <main class="escenas" id="escenas"></main>

    <!-- ============ PIE: PRÓXIMOS CIERRES ============ -->
    <footer class="pie">
      <div class="pie-titulo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 6v6l4 2.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        PRÓXIMOS CIERRES
      </div>
      <div class="pie-lista" id="pieLista"></div>
    </footer>

    <!-- ============ CAPAS ============ -->
    <div class="capa" id="capaResultado" aria-live="polite"></div>
    <div class="capa" id="capaJugada" aria-live="polite"></div>
  </div>

  <script>window.VISOR_CONFIG = { wsUrl: "{{ ws_url|escapejs }}" };</script>

  <script src="js/vendor/qrcode.js?v={{vjs}}"></script>
  <script src="js/config_visor.js?v={{vjs}}"></script>
  <script src="js/catalogo_loterias.js?v={{vjs}}"></script>
  <script src="js/cone_db_loterias.js?v={{vjs}}"></script>
  <script src="js/funcionamiento_visor.js?v={{vjs}}"></script>
</body>
</html>
