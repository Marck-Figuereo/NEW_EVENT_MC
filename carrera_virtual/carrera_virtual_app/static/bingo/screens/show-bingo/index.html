<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Bingo — pantalla</title>

    <!-- Pantalla del BINGO (canvas + CreateJS + TweenMax).
         La controla el visor desde funcionamiento_bingo.js mediante window.BingoScreen.
         Aqui no hay datos: todo llega del visor (cone_db_bingo.js). -->

    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="stylesheet" href="css/normalize.css" />
    <script>
    /* Recursos versionados con el ?v= del iframe (vjs de Django), igual que la ruleta:
       el navegador nunca mezcla un archivo nuevo con otro viejo guardado en cache. */
    window.BINGO_V = (location.search.match(/[?&]v=([^&]+)/) || [])[1] || String(Date.now());
    document.write('<link rel="stylesheet" href="css/main.css?v=' + BINGO_V + '">');
    </script>
</head>

<body>
    <div id="mainLoader">
        <span>0</span>
    </div>

    <div id="mainHolder">
        <div id="notSupportHolder">
            <div class="notSupport">NAVEGADOR NO SOPORTADO</div>
        </div>

        <div id="canvasHolder">
            <canvas id="gameCanvas" width="1600" height="900"></canvas>
        </div>
    </div>

    <!-- Todo local: el visor puede estar sin internet -->
    <script src="js/vendor/jquery.min.js"></script>
    <script src="js/vendor/createjs.min.js"></script>
    <script src="js/vendor/TweenMax.min.js"></script>

    <script>
    ['sound', 'canvas', 'game', 'main', 'loader', 'init'].forEach(function (n) {
        document.write('<script src="js/' + n + '.js?v=' + BINGO_V + '"><\/script>');
    });
    </script>
</body>
</html>
